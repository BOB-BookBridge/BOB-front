name: CD

on:
  push:
    branches: [develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 20
  NEXT_TELEMETRY_DISABLED: 1
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/fserver

jobs:
  build:
    name: Production Build  
    runs-on: ubuntu-22.04
    env:
      ENV_PRODUCTION: ${{ secrets.ENV_PRODUCTION }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare .env.production
        if: ${{ env.ENV_PRODUCTION != '' }}
        run: |
          echo "$ENV_PRODUCTION" > .env.production
          chmod 644 .env.production

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build:ci

  publish-image:
    name: Publish Docker Image
    needs: [build]
    runs-on: ubuntu-22.04
    env:
      ENV_PRODUCTION: ${{ secrets.ENV_PRODUCTION }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare .env.production
        if: ${{ env.ENV_PRODUCTION != '' }}
        run: |
          echo "$ENV_PRODUCTION" > .env.production
          chmod 644 .env.production

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push (no artifact)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy
    needs: [publish-image]
    runs-on: ubuntu-22.04
    steps:
      - name: Run fserver deploy on EC2
        uses: appleboy/ssh-action@v0.1.10
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script_stop: true
          envs: DOCKERHUB_USERNAME,DOCKERHUB_PASSWORD
          script: |
            sudo chmod +x /home/ubuntu/deploy/fserver-deploy.sh
            /home/ubuntu/deploy/fserver-deploy.sh
